[project]
name = "hotel-operations"
version = "0.1.0"
description = "A fictional hotel with a real agent runtime: a tool-using concierge with human approvals."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai-agents",
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy>=2.0",
    "alembic",
    "tzdata",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hotel_operations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: real OpenAI calls; explicit opt-in only (HOTEL_LIVE_TESTS=1), never in CI",
]
addopts = "-p no:cacheprovider"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"migrations/**" = ["E501"]
# Developer verification scripts run fixed local commands (git, uv, npm).
"scripts/**" = ["S602", "S603", "S607", "S310"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
